<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yslep - Member Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #fff1f2; }
        ::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 4px; }
        
        body {
            background: linear-gradient(135deg, #fee2e2 0%, #fce7f3 100%);
        }
        
        .login-card {
            background: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .button-glow {
            transition: all 0.3s ease;
        }
        
        .button-glow:hover {
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Main Login Section -->
        <div class="login-card rounded-3xl p-10 border border-rose-100">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-red-100 text-red-500 mb-4 shadow-sm">
                    <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </div>
                <h1 class="text-4xl font-extrabold text-rose-900">Yslep</h1>
                <p class="text-rose-600 mt-2 text-sm">Community Service Portal</p>
            </div>

            <div class="space-y-4">
                <!-- Member Portal Button -->
                <button onclick="navigateTo('Yslep.html')" class="button-glow w-full bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-red-500/30 transition">
                    <div class="flex items-center justify-center gap-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <span>Member Portal</span>
                    </div>
                </button>

                <!-- Admin Portal Button -->
                <button onclick="handleAdminAccess()" class="button-glow w-full bg-gradient-to-r from-rose-400 to-rose-500 hover:from-rose-500 hover:to-rose-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-rose-400/30 transition">
                    <div class="flex items-center justify-center gap-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                        </svg>
                        <span>Admin Portal</span>
                    </div>
                </button>
            </div>

            <!-- Admin Password Modal (Hidden) -->
            <div id="admin-modal" class="hidden fixed inset-0 bg-rose-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl border border-rose-100">
                    <h2 class="text-2xl font-bold text-rose-900 mb-6">Admin Access</h2>
                    <p class="text-rose-600 mb-6 text-sm">Enter the admin password to continue.</p>
                    
                    <form onsubmit="verifyAdminPassword(event)" class="space-y-4">
                        <input type="password" id="admin-password" placeholder="Admin Password" required class="w-full px-4 py-3 border-2 border-rose-100 rounded-2xl focus:outline-none focus:border-red-400 focus:ring-4 focus:ring-red-50 bg-rose-50/50">
                        
                        <div id="error-msg" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-xl text-center font-semibold"></div>
                        
                        <div class="flex gap-3">
                            <button type="button" onclick="closeAdminModal()" class="flex-1 px-4 py-3 border-2 border-rose-200 text-rose-600 font-bold rounded-2xl hover:bg-rose-50 transition">Cancel</button>
                            <button type="submit" class="flex-1 px-4 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-2xl transition shadow-lg shadow-red-500/30">Access</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Info Section -->
            <div class="mt-10 pt-6 border-t border-rose-100">
                <p class="text-xs text-center text-rose-500">
                    Version 1.0 | Secure Community Service Management System
                </p>
            </div>
        </div>
    </div>

    <script>
        // Default admin password - Change this to a strong password in production
        const ADMIN_PASSWORD = "admin123";

        function navigateTo(page) {
            window.location.href = page;
        }

        function handleAdminAccess() {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('admin-password').focus();
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-password').value = '';
            document.getElementById('error-msg').classList.add('hidden');
        }

        function verifyAdminPassword(event) {
            event.preventDefault();
            const password = document.getElementById('admin-password').value;
            const errorMsg = document.getElementById('error-msg');

            if (password === ADMIN_PASSWORD) {
                // Store admin session (basic)
                sessionStorage.setItem('adminAccess', 'true');
                navigateTo('Yslep-Admin.html');
            } else {
                errorMsg.textContent = 'Invalid password. Please try again.';
                errorMsg.classList.remove('hidden');
                document.getElementById('admin-password').value = '';
            }
        }

        // Close modal when pressing Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeAdminModal();
            }
        });

        // Check admin session
        window.addEventListener('load', function() {
            if (sessionStorage.getItem('adminAccess') === 'true') {
                // Optional: auto-redirect if admin session exists
                // navigateTo('Yslep-Admin.html');
            }
        });
    </script>

</body>
</html>
